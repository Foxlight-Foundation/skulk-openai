[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skulk-openai"
version = "0.1.0"
description = "Experimental managed inference capability learning reference"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.12,<3",
    "httpx>=0.28,<0.29",
    "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
skulk-openai-demo = "skulk_openai.demo:main"
skulk-openai-account = "skulk_openai.setup:main"

[dependency-groups]
dev = ["basedpyright>=1.31,<2", "ruff>=0.13,<1", "pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "build>=1.3,<2", "jsonschema>=4.26,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/skulk_openai", "src/skulk_inference_reference"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["managed: requires the separately licensed capability SDK"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv]
default-groups = ["dev"]
