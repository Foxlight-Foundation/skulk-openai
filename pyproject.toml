[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skulk-openai"
version = "0.4.1"
description = "Experimental managed inference capability learning reference"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.12,<3",
    "httpx>=0.28,<0.29",
    "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
skulk-openai-demo = "skulk_openai.demo:main"
skulk-openai-account = "skulk_openai.setup:main"
skulk-openai-sign = "skulk_openai.caller:main"
skulk-openai-capability = "skulk_openai.managed:main"
skulk-openai-ui = "skulk_openai.ui:main"

[dependency-groups]
# Core's pinned source reader imports these only during release verification;
# they are not additional roots in the capability's signed runtime.
publisher = [
    "skulk-capability-nodes==0.10.1",
    "skulk-capability-sdk==0.5.2",
    "fastapi==0.136.3",
    "loguru==0.7.3",
    "aiofiles==25.1.0",
    "aiohttp==3.13.3",
    "tomlkit==0.14.0",
    "huggingface-hub==1.8.0",
    "tuf==6.0.0",
    "rustworkx==0.17.1",
    "pyyaml==6.0.3",
    "anyio==4.11.0",
    "psutil>=7.2.2",
]
dev = ["basedpyright>=1.31,<2", "ruff>=0.13,<1", "pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "build>=1.3,<2", "jsonschema>=4.26,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/skulk_openai", "src/skulk_inference_reference"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["managed: requires the separately licensed capability SDK"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["src/skulk_openai/managed.py"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
skulk-capability-nodes = { git = "https://github.com/Foxlight-Foundation/skulk-capability-nodes", rev = "2fb5043579e88d8008a8149b2544418e40c8e504" }
skulk-capability-sdk = { git = "https://github.com/Foxlight-Foundation/skulk-capability-nodes", rev = "2fb5043579e88d8008a8149b2544418e40c8e504", subdirectory = "sdk-public" }
