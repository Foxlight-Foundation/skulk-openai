[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skulk-openai"
version = "0.5.2"
description = "Experimental managed inference capability learning reference"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.12,<3",
    "httpx>=0.28,<0.29",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=50.0.2,<51",
    "anyio>=4.14.2,<5",
]

[project.scripts]
skulk-openai-demo = "skulk_openai.demo:main"
skulk-openai-account = "skulk_openai.setup:main"
skulk-openai-sign = "skulk_openai.caller:main"
skulk-openai-capability = "skulk_openai.managed:main"
skulk-openai-native = "skulk_openai.native_managed:main"
skulk-openai-state = "skulk_openai.state_cli:main"
skulk-openai-ui = "skulk_openai.ui:main"
skulk-openai-continuation = "skulk_openai.continuation_client:main"

[dependency-groups]
# Core's pinned source reader imports these only during release verification;
# they are not additional roots in the capability's signed runtime.
managed = ["skulk-capability-sdk==0.5.10rc1"]
native-runtime = [
    "skulk-capability-sdk==0.5.10rc1",
    "skulk-capability-kernel==0.7.0rc4; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
]
publisher = [
    "skulk-capability-nodes==0.10.5",
    "skulk-capability-sdk==0.5.10rc1",
    "fastapi==0.136.3",
    "loguru==0.7.3",
    "aiofiles==25.1.0",
    "aiohttp==3.14.5",
    "tomlkit==0.14.0",
    "huggingface-hub==1.8.0",
    "tuf==6.0.0",
    "rustworkx==0.17.1",
    "pyyaml==6.0.3",
    "anyio==4.16.0",
    "psutil>=7.2.2",
]
dev = ["basedpyright>=1.31,<2", "ruff>=0.13,<1", "pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "build>=1.3,<2", "jsonschema>=4.26,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/skulk_openai", "src/skulk_inference_reference"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["managed: requires the separately licensed capability SDK"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["src/skulk_openai/managed.py", "src/skulk_openai/native_managed.py", "src/skulk_openai/native_contracts.py"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# Immutable public binaries; neither contributor nor managed CI needs private Git.
skulk-capability-nodes = { url = "https://skulkapps.foxlight.ai/releases/reference.openai/42378358083/macos-arm64/skulk_capability_nodes-0.10.5-py3-none-any.whl" }
skulk-capability-sdk = { url = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/v0.5.10-rc.1/skulk_capability_sdk-0.5.10rc1-py3-none-any.whl" }
skulk-capability-kernel = [
    { url = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.4/skulk_capability_kernel-0.7.0rc4-cp313-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { url = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.4/skulk_capability_kernel-0.7.0rc4-cp313-abi3-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.4/skulk_capability_kernel-0.7.0rc4-cp313-abi3-manylinux_2_34_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
